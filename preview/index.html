<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grind City Preview</title>
<style>
  :root { --bg: #2B1D14; --ink: #E3DAC4; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px ui-monospace, Menlo, monospace; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #ui { position: fixed; top: 8px; left: 8px; background: #2B1D14cc; padding: 8px 10px; border-radius: 4px; display: grid; gap: 6px; }
  label { display: flex; gap: 6px; align-items: center; }
</style></head><body>
<canvas id="c"></canvas>
<div id="ui">
  <label>view <select id="mode"><option value="test">test street</option><option value="map">full map.json</option></select></label>
  <label>hour <input id="hour" type="range" min="0" max="24" step="0.25" value="12"><span id="hv">12</span></label>
  <label>scale <input id="scale" type="range" min="1" max="4" step="1" value="2"></label>
  <label><input id="prod" type="checkbox" checked> buildings producing</label>
  <label><input id="dbg" type="checkbox"> footprints</label>
  <div>drag to pan</div>
</div>
<script type="module">
// Stands in for RUN: loads only dist/{city.png, atlas.json, map.json} and the runtime.
import { loadCity, createCityRenderer } from '../runtime/city-renderer.js';

const city = await loadCity('../dist/');
const $ = id => document.getElementById(id);
const canvas = $('c');

// Test street: the shop at all three tiers (2x2 and 1x1), plus a 3x3, all
// facing a two-lane road across a sidewalk.
const C = 14, R = 9;
const ground = Array.from({ length: R }, (_, r) => Array.from({ length: C }, () =>
  r === 6 ? 'ground_road_ew_cy' : r === 7 ? 'ground_road_ew_yc' : 'ground_sidewalk_01'));
const testMap = {
  tileW: city.map.tileW, tileH: city.map.tileH, size: { cols: C, rows: R }, ground,
  objects: [
    { objectId: 'shop_t1', col: 0, row: 2, footprint: [2, 2], category: 'shop', facing: 'left' },
    { objectId: 'shop_t2', col: 2, row: 2, footprint: [2, 2], category: 'shop', facing: 'left' },
    { objectId: 'shop_t3', col: 4, row: 2, footprint: [2, 2], category: 'shop', facing: 'left' },
    { objectId: 'shop_s1', col: 6, row: 3, footprint: [1, 1], category: 'shop', facing: 'left' },
    { objectId: 'shop_s2', col: 7, row: 3, footprint: [1, 1], category: 'shop', facing: 'left' },
    { objectId: 'office_1', col: 8, row: 1, footprint: [3, 3], category: 'office', facing: 'left' },
    { objectId: 'tower_1', col: 11, row: 2, footprint: [2, 2], category: 'tower', facing: 'right' },
    ...[1, 5, 9, 13].map(c => ({ objectId: `tree_${c}`, col: c, row: 5, footprint: [1, 1], sprite: 'prop_street_tree' })),
    ...[3, 11].map(c => ({ objectId: `lamp_${c}`, col: c, row: 5, footprint: [1, 1], sprite: 'prop_lamp' })),
  ].filter(o => !o.sprite || city.atlas.frames[o.sprite]),
};
// Stand-in save file: tier and production state live here, never in the map.
const TEST_TIERS = { shop_t1: 1, shop_t2: 2, shop_t3: 3, shop_s1: 1, shop_s2: 2 };
const save = id => ({
  tier: TEST_TIERS[id] ?? (id.startsWith('shop_') ? 1 + (parseInt(id.split('_')[1]) % 3) : 1),
  producing: $('prod').checked && (id.startsWith('shop') || parseInt(id.split('_')[1]) % 3 === 0),
});

let r, cam;
function build() {
  const map = $('mode').value === 'test' ? testMap : city.map;
  r = createCityRenderer(canvas, { ...city, map }, { resolve: save, scale: +$('scale').value });
  cam = { x: (r.bounds.x0 + r.bounds.x1) / 2, y: (r.bounds.y0 + r.bounds.y1) / 2 - ($('mode').value === 'test' ? 90 : 0) };
}
function frame() {
  canvas.width = innerWidth; canvas.height = innerHeight;
  r.setScale(+$('scale').value);
  $('hv').textContent = $('hour').value;
  r.draw({ camX: cam.x, camY: cam.y, hour: +$('hour').value, debug: $('dbg').checked });
}
for (const el of ['hour', 'scale', 'prod', 'dbg']) $(el).oninput = frame;
$('mode').onchange = () => { build(); frame(); };
let drag = null;
canvas.onpointerdown = e => drag = { x: e.clientX, y: e.clientY };
onpointerup = () => drag = null;
onpointermove = e => { if (!drag) return; cam.x -= (e.clientX - drag.x) / r.scale; cam.y -= (e.clientY - drag.y) / r.scale; drag = { x: e.clientX, y: e.clientY }; frame(); };
onresize = frame;
const q = new URLSearchParams(location.search);
for (const [k, v] of q) { const el = $(k); if (el) el.type === 'checkbox' ? (el.checked = v === '1') : (el.value = v); }
build(); frame();
window.ready = true;
</script>
</body></html>
