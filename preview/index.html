<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grind City Preview</title>
<style>
  :root { --bg: #2B1D14; --ink: #E3DAC4; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px ui-monospace, Menlo, monospace; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #ui { position: fixed; top: 8px; left: 8px; background: #2B1D14cc; padding: 8px 10px; border-radius: 4px; display: grid; gap: 6px; }
  label { display: flex; gap: 6px; align-items: center; }
</style></head><body>
<canvas id="c"></canvas>
<div id="ui">
  <label>view <select id="mode"><option value="test">test street</option><option value="map">full map.json</option></select></label>
  <label>hour <input id="hour" type="range" min="0" max="24" step="0.25" value="12"><span id="hv">12</span></label>
  <label>scale <input id="scale" type="range" min="1" max="4" step="1" value="2"></label>
  <label><input id="prod" type="checkbox" checked> buildings producing</label>
  <label><input id="dbg" type="checkbox"> footprints</label>
  <div>drag to pan</div>
</div>
<script type="module">
// Stands in for RUN: loads only dist/{city.png, atlas.json, map.json} and the runtime.
import { loadCity, createCityRenderer } from '../runtime/city-renderer.js';

const city = await loadCity('../dist/');
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);
const canvas = $('c');

// Test street: the coffee shop in every state — vacant (cones), under
// construction, built at tiers 1–3, renovating — plus people and parked cars.
const C = 16, R = 9;
const ground = Array.from({ length: R }, (_, r) => Array.from({ length: C }, () =>
  r === 6 ? 'ground_road_ew_cy' : r === 7 ? 'ground_road_ew_yc' : 'ground_sidewalk_01'));
const F = city.atlas.frames;
const testMap = {
  tileW: city.map.tileW, tileH: city.map.tileH, size: { cols: C, rows: R }, ground,
  objects: [
    { objectId: 'shop_vacant', col: 0, row: 2, footprint: [2, 2], category: 'shop', facing: 'left' },
    { objectId: 'shop_build', col: 2, row: 2, footprint: [2, 2], category: 'shop', facing: 'left' },
    { objectId: 'shop_t1', col: 4, row: 2, footprint: [2, 2], category: 'shop', facing: 'left' },
    { objectId: 'shop_t2', col: 6, row: 2, footprint: [2, 2], category: 'shop', facing: 'left' },
    { objectId: 'shop_t3', col: 8, row: 2, footprint: [2, 2], category: 'shop', facing: 'left' },
    { objectId: 'shop_reno', col: 10, row: 2, footprint: [2, 2], category: 'shop', facing: 'left' },
    { objectId: 'shop_s1', col: 12, row: 3, footprint: [1, 1], category: 'shop', facing: 'left' },
    { objectId: 'shop_s_vacant', col: 13, row: 3, footprint: [1, 1], category: 'shop', facing: 'left' },
    { objectId: 'office_1', col: 14, row: 2, footprint: [2, 2], category: 'office', facing: 'left' },
    ...[1, 5, 9, 13].map(c => ({ objectId: `tree_${c}`, col: c, row: 5, footprint: [1, 1], sprite: 'prop_street_tree' })),
    ...[3, 11].map(c => ({ objectId: `lamp_${c}`, col: c, row: 5, footprint: [1, 1], sprite: 'prop_lamp' })),
    { objectId: 'cafe_1', col: 4, row: 4, footprint: [1, 1], sprite: 'prop_cafe_table' },
    { objectId: 'p1', col: 2, row: 4, footprint: [1, 1], sprite: 'ped_man_dog_se', nudge: [0, 0.1] },
    { objectId: 'p2', col: 7, row: 4, footprint: [1, 1], sprite: 'ped_parent_kids_nw', nudge: [0.1, 0] },
    { objectId: 'p3', col: 10, row: 5, footprint: [1, 1], sprite: 'ped_cyclist_se' },
    { objectId: 'p4', col: 12, row: 4, footprint: [1, 1], sprite: 'ped_business_nw' },
    { objectId: 'p5', col: 6, row: 5, footprint: [1, 1], sprite: 'ped_woman_bags_se' },
    { objectId: 'car_1', col: 0, row: 7, footprint: [1, 1], sprite: 'veh_car_a_se', nudge: [0, 0.28] },
    { objectId: 'car_2', col: 3, row: 7, footprint: [1, 1], sprite: 'veh_taxi_se', nudge: [0, 0.28] },
    { objectId: 'car_3', col: 8, row: 6, footprint: [1, 1], sprite: 'veh_car_c_nw', nudge: [0, -0.28] },
    { objectId: 'car_4', col: 11, row: 7, footprint: [1, 1], sprite: 'veh_car_b_se', nudge: [0, 0.28] },
  ].filter(o => !o.sprite || F[o.sprite]),
};
// Stand-in save file: owned or not, tier, production and works in progress
// live here, never in the map.
const TEST = {
  shop_vacant: { state: 'vacant' }, shop_s_vacant: { state: 'vacant' },
  shop_build: { state: 'constructing', tier: 1 }, shop_reno: { state: 'renovating', tier: 2 },
  shop_t1: { tier: 1 }, shop_t2: { tier: 2 }, shop_t3: { tier: 3 }, shop_s1: { tier: 2 },
};
function hashId(id) { let h = 7; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; }
// Stand-in save file, the way RUN would keep it. Vacant spots come from the
// map (startState); clicking one buys it and plays the build, clicking an open
// coffee shop renovates it.
const BUILD_MS = 4000, RENOVATE_MS = 2500;
const saved = {};
const save = id => {
  const producing = $('prod').checked;
  if (TEST[id]) return { tier: 1, producing: producing && !TEST[id].state, ...TEST[id] };
  const s = saved[id];
  if (s?.startedAt) {
    const t = (performance.now() - s.startedAt) / (s.state === 'constructing' ? BUILD_MS : RENOVATE_MS);
    if (t >= 1) { delete s.startedAt; s.state = 'built'; }
    else return { ...s, progress: s.state === 'constructing' ? t : undefined, producing: false };
  }
  const tier = s?.tier ?? 1 + (hashId(id) >> 4) % 3;
  return { ...s, tier, producing: producing && (id.startsWith('shop_') || hashId(id) % 3 === 0) };
};
function onClick(sx, sy) {
  // Screen → world → grid: invert the projection, then find the object whose footprint holds that cell.
  const k = r.scale, wx = (sx - canvas.clientWidth / 2) / k + cam.x, wy = (sy - canvas.clientHeight / 2) / k + cam.y;
  const c = Math.floor((wx / 32 + wy / 16) / 2), row = Math.floor((wy / 16 - wx / 32) / 2);
  const map = mode === 'test' ? testMap : city.map;
  const o = map.objects.find(o => ['shop', 'stand'].includes(o.category) && c >= o.col && c < o.col + o.footprint[0] && row >= o.row && row < o.row + o.footprint[1]);
  if (!o || TEST[o.objectId]) return;
  const state = saved[o.objectId]?.state ?? o.startState ?? 'built';
  if (state === 'vacant') saved[o.objectId] = { state: 'constructing', startedAt: performance.now(), tier: 1 };
  else if (state === 'built') saved[o.objectId] = { ...saved[o.objectId], state: 'renovating', startedAt: performance.now() };
  frame();
}

let r, cam;
function build() {
  const map = $('mode').value === 'test' ? testMap : city.map;
  r = createCityRenderer(canvas, { ...city, map }, { resolve: save, scale: +$('scale').value });
  cam = { x: (r.bounds.x0 + r.bounds.x1) / 2, y: (r.bounds.y0 + r.bounds.y1) / 2 - ($('mode').value === 'test' ? 90 : 0) };
}
let fixedTime = q.get('t') ? +q.get('t') : null;
function frame() {
  canvas.width = innerWidth; canvas.height = innerHeight;
  r.setScale(+$('scale').value);
  $('hv').textContent = $('hour').value;
  r.draw({ camX: cam.x, camY: cam.y, hour: +$('hour').value, debug: $('dbg').checked, time: fixedTime ?? performance.now() });
}
// Keep redrawing while something is being built or renovated (~10fps).
let last = 0;
(function loop(now) { if (now - last > 100 && fixedTime == null && r?.animating()) { last = now; frame(); } requestAnimationFrame(loop); })(0);
for (const el of ['hour', 'scale', 'prod', 'dbg']) $(el).oninput = frame;
$('mode').onchange = () => { build(); frame(); };
let drag = null;
canvas.onpointerdown = e => drag = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY };
onpointerup = e => { if (drag && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 4) onClick(e.clientX, e.clientY); drag = null; };
onpointermove = e => { if (!drag) return; cam.x -= (e.clientX - drag.x) / r.scale; cam.y -= (e.clientY - drag.y) / r.scale; drag = { ...drag, x: e.clientX, y: e.clientY }; frame(); };
onresize = frame;
for (const [k, v] of q) { const el = $(k); if (el) el.type === 'checkbox' ? (el.checked = v === '1') : (el.value = v); }
build();
// Debug: centre the camera on a map cell, e.g. ?mode=map&cell=40,52
if (q.get('cell')) { const [c, r] = q.get('cell').split(',').map(Number); cam = { x: (c - r) * 32, y: (c + r) * 16 }; }
frame();
window.ready = true;
</script>
</body></html>
